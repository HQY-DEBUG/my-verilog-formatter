name: 插件测试与发布

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_identity:
        description: 仅验证发布身份并显示 Marketplace 成员 ID，不发布插件
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 测试并生成 Windows x64 安装包
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_identity
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: 检查版本清单和标签
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $version = $package.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw '仅支持正式版本号 x.y.z' }
          if ($lock.version -ne $version -or $lock.packages[''].version -ne $version) {
            throw 'package.json 与 package-lock.json 版本不一致'
          }
          if ($package.publisher -ne 'hanxuyao' -or $package.name -ne 'hanxuyao-plugin') {
            throw '插件发布身份不一致'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Git 标签必须与 package.json 的版本一致'
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch ('(?m)^## \[' + [regex]::Escape($version) + '\]')) {
            throw 'CHANGELOG.md 缺少当前版本说明'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: 安装项目依赖
        run: npm ci --no-audit --no-fund
      - name: 安装 MATLAB 集成构建依赖
        run: npm run setup:matlab --if-present
      - name: 编译运行资源
        run: npm run compile
      - name: 运行测试
        run: npm test -- --runInBand
      - name: 安装发布工具
        run: npm install --global @vscode/vsce@3.9.2
      - name: 编译并打包
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: vsce package --target win32-x64 --skip-license --out "hanxuyao-plugin-$env:RELEASE_VERSION-win32-x64.vsix"
      - name: 保存安装包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketplace-vsix
          path: hanxuyao-plugin-${{ steps.version.outputs.version }}-win32-x64.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 验证身份或发布到 Marketplace
    needs: build
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.verify_identity))
    runs-on: windows-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - name: 检查发布身份配置
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if (-not $env:AZURE_CLIENT_ID -or -not $env:AZURE_TENANT_ID) {
            throw '请先按 docs/自动发布.md 配置 marketplace 环境中的 Azure 身份'
          }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: 下载本次构建的安装包
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: marketplace-vsix
      - name: 安装发布工具
        run: npm install --global @vscode/vsce@3.9.2
      - name: 使用 GitHub OIDC 登录 Microsoft Entra ID
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: 显示 Marketplace 成员 ID
        if: github.event_name == 'workflow_dispatch'
        run: |
          $identityId = az rest --method GET --uri 'https://app.vssps.visualstudio.com/_apis/profile/profiles/me' --resource '499b84ac-1321-427f-aa17-267ca6975798' --query id --output tsv
          if ($LASTEXITCODE -ne 0 -or -not $identityId) { throw '无法获取 Azure DevOps 身份 ID' }
          "Marketplace 成员 ID：$identityId" >> $env:GITHUB_STEP_SUMMARY
      - name: 校验 Marketplace 发布权限
        run: vsce verify-pat --azure-credential hanxuyao
      - name: 发布已验证的安装包
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: vsce publish --azure-credential --packagePath "hanxuyao-plugin-$env:RELEASE_VERSION-win32-x64.vsix"
